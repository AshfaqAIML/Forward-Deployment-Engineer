# Project 5.1 - Reverse proxy configuration: port 80 in, API on 8000 out.
server {
    listen 80;

    # Basic hardening headers (full hardening is a Level 5+ topic).
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # The dashboard and the API respond to /api/health through the proxy too.
    location = /api/health {
        proxy_pass http://api:8000/api/health;
        access_log off;
    }
}
