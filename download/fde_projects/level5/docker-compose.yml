# Project 5.1 - Two-service deployment: the API behind a reverse proxy.
# Start everything:        docker compose up -d
# Stop and keep the data:  docker compose down
# Stop and wipe the data:  docker compose down -v   (careful!)
services:
  api:
    build:
      context: ../level4/task_app
      dockerfile: ../level5/Dockerfile
    environment:
      TASK_DB: /data/tasks.db
    volumes:
      - taskdata:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  taskdata:
