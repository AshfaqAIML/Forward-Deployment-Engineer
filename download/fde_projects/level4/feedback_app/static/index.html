<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Dashboard</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 12px; }
  h1 { color: #2c3440; } h2 { color: #46566b; border-bottom: 2px solid #f0d9c8; padding-bottom: 4px; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { background: #f8f0eb; border-radius: 8px; padding: 12px 18px; min-width: 130px; }
  .card .num { font-size: 1.6em; font-weight: bold; color: #c27e4d; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eee; }
  th { background: #f8f0eb; color: #2c3440; }
  #tickets td:nth-child(3) { min-width: 220px; }
</style>
</head>
<body>
<h1>Customer Feedback Dashboard</h1>
<p id="health">connecting…</p>
<div class="cards" id="cards"></div>

<h2>Average rating by channel</h2>
<table id="channels"></table>

<h2>Average rating by category</h2>
<table id="categories"></table>

<h2>Most recent tickets (any rating)</h2>
<table id="tickets"></table>

<script>
function card(label, value) {
  return `<div class="card"><div class="num">${value}</div><div>${label}</div></div>`;
}
function fillTable(id, headers, rows) {
  const t = document.getElementById(id);
  t.innerHTML = "<tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>" +
    rows.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("");
}

async function refresh() {
  const health = await fetch("/api/health").then(r => r.json());
  document.getElementById("health").textContent =
    "API status: " + health.status + " | " + health.tickets + " tickets loaded";
  const s = await fetch("/api/stats").then(r => r.json());
  document.getElementById("cards").innerHTML =
    card("Tickets", s.total_tickets) +
    card("Avg rating", s.average_rating) +
    card("Escalation %", s.escalation_rate_pct) +
    card("Ratings 1-2", s.low_rating_tickets);
  fillTable("channels", ["Channel", "Tickets", "Avg rating"],
    Object.entries(s.by_channel).map(([k, v]) => [k, v.count, v.avg_rating]));
  fillTable("categories", ["Category", "Tickets", "Avg rating"],
    Object.entries(s.by_category).map(([k, v]) => [k, v.count, v.avg_rating]));
  const recent = await fetch("/api/tickets?limit=8").then(r => r.json());
  fillTable("tickets", ["Date", "Channel", "Comment", "Rating"],
    recent.tickets.map(t => [t.date, t.channel, t.comment, t.rating]));
}

refresh();
</script>
</body>
</html>
