<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE Academy — From Zero Knowledge to Real-World Engineering</title>
<meta name="description" content="FDE Academy: an 18-stage guided path from first arithmetic to deployed, customer-facing engineering projects.">
<style>
/* ================= FDE Academy design system (per Website Design Specification v1.0) ================= */
:root{
  --ink-900:#1A2330; --ink-700:#2C3440; --slate-600:#46566B; --slate-500:#68727E;
  --amber-500:#C27E4D; --amber-700:#A55F33; --amber-800:#8F5229; --amber-50:#FFF7ED;
  --teal-700:#2E7D74; --teal-50:#F0FDF4; --red-700:#B3452E; --red-50:#FDF1EE;
  --navy-800:#1E3A5F; --navy-50:#EFF6FF;
  --surface:#F5F7FA; --surface-2:#EEF2F6; --line:#D9DEE4; --line-strong:#B9C2CC;
  --white:#FFFFFF; --focus:#1A2330;
  --r-s:6px; --r-m:10px; --r-l:14px; --r-full:999px;
  --sh-1:0 1px 3px rgba(26,35,48,.08); --sh-2:0 6px 18px rgba(26,35,48,.14);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'Courier New',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{font-family:var(--font);color:var(--ink-700);background:var(--surface);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg,canvas{max-width:100%;height:auto}
button{font-family:inherit}
a{color:var(--navy-800)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--ink-900);color:#fff;padding:10px 16px;z-index:200;border-radius:0 0 8px 0}
.skip-link:focus{left:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--white);border-bottom:2px solid var(--ink-900);display:flex;align-items:center;gap:26px;padding:10px clamp(14px,3vw,40px)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:var(--r-m)}
.logo:hover{background:var(--surface)}
.logo .glyph{flex:0 0 30px}
.logo .wm{font-weight:800;font-size:17px;color:var(--ink-900);letter-spacing:.2px;line-height:1.1}
.logo .wm small{display:block;font-weight:500;font-size:9.5px;color:var(--slate-500);letter-spacing:.3px}
.topnav{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav button{background:none;border:none;cursor:pointer;font-size:14px;color:var(--slate-600);padding:8px 11px;border-radius:8px;white-space:nowrap}
.topnav button:hover{background:var(--surface-2);color:var(--ink-900)}
.topnav button[aria-current="page"]{color:var(--ink-900);font-weight:700;box-shadow:0 3px 0 var(--ink-900);border-radius:8px 8px 0 0}
.top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--amber-500);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border:2px solid var(--ink-900);cursor:pointer}
.burger{display:none;background:var(--white);border:2px solid var(--ink-900);border-radius:8px;padding:8px;cursor:pointer}
.mobile-menu{display:none;background:var(--white);border-bottom:2px solid var(--ink-900);padding:10px 16px 16px}
.mobile-menu.open{display:block}
.mobile-menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:12px 10px;font-size:15.5px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink-700)}
.mobile-menu button[aria-current="page"]{font-weight:700;color:var(--amber-800)}
@media (max-width:1023px){.topnav{display:none}.burger{display:block}.top-actions .btn{display:none}}
/* ---------- layout ---------- */
#app{min-height:70vh}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(14px,3vw,40px)}
.page-head{padding:30px 0 8px}
h1{font-size:clamp(24px,4.5vw,30px);font-weight:800;color:var(--ink-900);line-height:1.2}
.lede{color:var(--slate-600);max-width:70ch;margin-top:8px;font-size:15.5px}
.section{padding:26px 0 8px}
.h2{font-size:clamp(19px,3vw,22px);font-weight:700;color:var(--ink-900);margin-bottom:6px}
.h3{font-size:16.5px;font-weight:650;color:var(--ink-900);margin-bottom:6px}
.sub{color:var(--slate-500);font-size:13.5px;margin-bottom:16px;max-width:75ch}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
@media (max-width:1023px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g6{grid-template-columns:repeat(3,1fr)}}
@media (max-width:639px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}.top-actions .searchbox{display:none}.topbar{gap:10px}.logo .wm{font-size:15px}}
.split{display:grid;grid-template-columns:290px 1fr;gap:24px;align-items:start}
.split-r{display:grid;grid-template-columns:1fr 310px;gap:24px;align-items:start}
@media (max-width:1023px){.split,.split-r{grid-template-columns:1fr}}
/* ---------- components ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;border:2px solid var(--ink-900);background:var(--white);color:var(--ink-900);cursor:pointer;text-decoration:none;transition:background .15s,transform .15s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber-700);border-color:var(--amber-700);color:#fff}
.btn.primary:hover{background:var(--amber-800);border-color:var(--amber-800)}
.btn.small{padding:6px 12px;font-size:12.5px}
.btn.subtle{border-color:var(--line-strong);color:var(--slate-600)}
.btn.danger{border-color:var(--red-700);color:var(--red-700);background:var(--red-50)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:var(--r-full);border:1.5px solid var(--line-strong);color:var(--slate-600);background:var(--white);margin:0 6px 6px 0}
button.chip{cursor:pointer}
.chip.on{background:var(--ink-900);color:#fff;border-color:var(--ink-900)}
.chip.amber{background:var(--amber-50);border-color:var(--amber-500);color:var(--amber-800)}
.chip.teal{background:var(--teal-50);border-color:var(--teal-700);color:var(--teal-700)}
.chip.red{background:var(--red-50);border-color:var(--red-700);color:var(--red-700)}
.card{background:var(--white);border:1.5px solid var(--line);border-radius:var(--r-m);padding:18px;box-shadow:var(--sh-1)}
.card.tint{background:var(--surface)}
.card h4{font-size:15px;font-weight:700;color:var(--ink-900);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card p{font-size:13.5px;color:var(--slate-600)}
.card.click{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.card.click:hover{border-color:var(--amber-500);box-shadow:var(--sh-2)}
.kpi{background:var(--white);border:1.5px solid var(--line);border-radius:var(--r-m);padding:16px;text-align:center}
.kpi .v{font-size:26px;font-weight:800;color:var(--ink-900)}
.kpi .l{font-size:12px;color:var(--slate-500);margin-top:4px}
.bar{height:10px;border-radius:var(--r-full);background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--amber-700);border-radius:var(--r-full);transition:width .4s}
.bar>i.teal{background:var(--teal-700)}
.meta{font-size:12px;color:var(--slate-500);margin-top:8px}
.row{display:flex;gap:12px;align-items:center}
.spread{justify-content:space-between;flex-wrap:wrap}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--white)}
.t-wrap{border:1.5px solid var(--line);border-radius:var(--r-m);overflow:auto;background:var(--white)}
table.t th{text-align:left;background:var(--amber-500);color:#fff;padding:10px 12px;font-weight:600;white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:none}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:8px 16px;border:1.5px solid var(--line-strong);border-radius:8px 8px 0 0;font-size:13.5px;color:var(--slate-600);background:var(--surface);cursor:pointer}
.tab[aria-selected="true"]{background:var(--white);font-weight:700;color:var(--ink-900);box-shadow:0 3px 0 var(--ink-900)}
.searchbox{border:2px solid var(--line-strong);border-radius:8px;padding:9px 14px;font-size:14px;color:var(--ink-700);background:var(--white);width:100%;max-width:520px}
.searchbox:focus{border-color:var(--amber-700);outline:none}
input.f,textarea.f,select.f{width:100%;border:2px solid var(--line-strong);border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;background:var(--white);color:var(--ink-700)}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--amber-700);outline:none}
input.f.err{border-color:var(--red-700)}
.ferr{color:var(--red-700);font-size:12.5px;margin-top:4px}
.flabel{font-size:13px;font-weight:600;color:var(--ink-700);display:block;margin:12px 0 6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:12px 20px;border-radius:var(--r-l);font-size:14px;box-shadow:var(--sh-2);z-index:120;max-width:90vw}
.toast.err{background:var(--red-700)}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sk 1.1s infinite;border-radius:var(--r-m)}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{border:2px dashed var(--line-strong);border-radius:var(--r-m);padding:28px;text-align:center;color:var(--slate-500);background:var(--white)}
.empty b{color:var(--ink-700)}
.statebox{border-radius:var(--r-m);padding:14px 16px;font-size:13.5px;margin:12px 0}
.statebox.err{background:var(--red-50);border-left:4px solid var(--red-700);color:var(--red-700)}
.statebox.ok{background:var(--teal-50);border-left:4px solid var(--teal-700);color:var(--teal-700)}
.statebox.info{background:var(--navy-50);border-left:4px solid var(--navy-800);color:var(--navy-800)}
/* lesson / prose */
.prose{max-width:74ch}
.prose p{margin:0 0 14px;font-size:15.5px;line-height:1.7}
.prose ul,.prose ol{margin:0 0 14px 22px}
.prose li{margin-bottom:6px}
.prose table.t{margin:14px 0}
.glossterm{border-bottom:2px dotted var(--amber-700);cursor:pointer;color:var(--ink-700);font-weight:600;background:none;border-top:none;border-left:none;border-right:none;padding:0;font-size:inherit;font-family:inherit}
.glossterm:hover{color:var(--amber-800)}
.codeblock{background:var(--ink-900);color:#D6DBE1;font-family:var(--mono);font-size:13.5px;line-height:1.65;padding:14px 16px;border-radius:8px;overflow-x:auto;white-space:pre;margin:14px 0}
.codeblock .cm{color:#8FA3B8}
.callout{background:var(--navy-50);border-left:4px solid var(--navy-800);border-radius:8px;padding:12px 16px;margin:14px 0;font-size:14px}
.callout.warn{background:var(--amber-50);border-color:var(--amber-700);color:var(--amber-800)}
.reader-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.exercise{border:2px solid var(--amber-500);border-radius:var(--r-m);padding:16px;margin:16px 0;background:var(--amber-50)}
.exercise .tag{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--amber-800);text-transform:uppercase;margin-bottom:6px}
.kcheck{border:2px solid var(--navy-800);border-radius:var(--r-m);padding:16px;margin:16px 0;background:var(--navy-50)}
.kcheck .tag{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--navy-800);text-transform:uppercase;margin-bottom:6px}
.option{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line-strong);border-radius:8px;padding:11px 14px;margin-bottom:9px;font-size:14px;background:var(--white);cursor:pointer;width:100%;text-align:left;font-family:inherit}
.option:hover{border-color:var(--ink-900)}
.option .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--slate-500);flex:0 0 18px;margin-top:2px}
.option.sel{border-color:var(--ink-900);box-shadow:0 0 0 3px var(--surface-2)}
.option.sel .radio{background:var(--ink-900);border-color:var(--ink-900)}
.option.correct{border-color:var(--teal-700);background:var(--teal-50)}
.option.wrong{border-color:var(--red-700);background:var(--red-50)}
.qrow{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--white);margin-bottom:8px;font-size:13.5px}
.tick{width:20px;height:20px;border-radius:50%;border:2px solid var(--slate-500);flex:0 0 20px}
.tick.done{background:var(--teal-700);border-color:var(--teal-700)}
.stage{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.stage .num{flex:0 0 36px;height:36px;border-radius:50%;border:2px solid var(--slate-500);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--white);color:var(--slate-600)}
.stage.done .num{background:var(--teal-700);color:#fff;border-color:var(--teal-700)}
.stage.current .num{background:#fff;border-color:var(--amber-700);color:var(--amber-800);box-shadow:0 0 0 4px var(--amber-50)}
.stage.locked{opacity:.55}
.stage .st-body{flex:1;min-width:0}
.stage .st-name{font-size:14.5px;font-weight:600;color:var(--ink-900)}
.stage .st-meta{font-size:12px;color:var(--slate-500);margin-top:2px}
.bookcard{display:flex;gap:14px}
.cover{width:74px;min-width:74px;height:102px;border-radius:6px;background:linear-gradient(160deg,var(--ink-900),var(--navy-800));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:13px;padding:6px;text-align:center;border:2px solid var(--ink-900)}
.cover small{font-weight:500;font-size:9px;color:#C9D4E2;margin-top:4px;letter-spacing:.4px}
/* footer */
.footer{margin-top:40px;background:var(--ink-900);color:#C9D4E2;padding:34px clamp(14px,3vw,40px) 40px}
.footer .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:26px}
@media (max-width:639px){.footer .wrap{grid-template-columns:repeat(2,1fr)}}
.footer b{display:block;color:#fff;margin-bottom:10px;font-size:13.5px}
.footer button{display:block;background:none;border:none;color:#C9D4E2;padding:3px 0;font-size:13px;cursor:pointer;text-align:left}
.footer button:hover{color:#fff;text-decoration:underline}
.footer .fine{margin-top:26px;font-size:12px;color:#8FA3B8}
/* math */
.mathexpr{font-family:Georgia,'Times New Roman',serif;font-size:19px;background:var(--white);border:1.5px solid var(--line);border-radius:8px;padding:10px 16px;display:inline-block;margin:8px 0;color:var(--ink-900)}
.mfrac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 4px}
.mfrac .top{border-bottom:2px solid var(--ink-900);padding:0 6px}
.mfrac .bot{padding:0 6px}
.msup{font-size:70%;vertical-align:super}
.msqrt{display:inline-flex;align-items:stretch}
.msqrt .sign{border-top:2px solid var(--ink-900);border-left:2px solid var(--ink-900);border-bottom:2px solid var(--ink-900);width:8px;border-radius:4px 0 0 4px;margin-right:-2px}
.msqrt .body{border-top:2px solid var(--ink-900);padding:2px 6px 0}
.mathwrap{background:var(--white);border:1.5px solid var(--line);border-radius:var(--r-m);padding:18px;margin:14px 0}
.mathwrap .ttl{font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--amber-800);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.steps{counter-reset:st;margin-top:6px}
.step{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:flex-start}
.step:last-child{border-bottom:none}
.step .n{counter-increment:st;flex:0 0 26px;height:26px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--slate-600)}
.step .n::before{content:counter(st)}
.mathslider{width:100%;accent-color:var(--amber-700)}
.mathval{font-family:var(--mono);font-size:13px;background:var(--surface);border-radius:6px;padding:2px 8px}
/* lab */
.editor{border:2px solid var(--ink-900);border-radius:var(--r-m);overflow:hidden}
.editor .edhead{display:flex;gap:8px;align-items:center;background:var(--ink-900);color:#C9D4E2;padding:8px 12px;font-size:12.5px}
.editor textarea{width:100%;min-height:220px;border:none;resize:vertical;font-family:var(--mono);font-size:13.5px;line-height:1.6;padding:14px;background:#222B36;color:#E7EDF3;outline:none}
.editor textarea:focus{box-shadow:inset 0 0 0 2px var(--amber-500)}
.output{background:var(--ink-900);color:#D6DBE1;font-family:var(--mono);font-size:13px;line-height:1.6;padding:14px 16px;border-radius:8px;min-height:64px;white-space:pre-wrap;overflow-x:auto}
.output .oerr{color:#F0A48E}
.output .ook{color:#9BD8CE}
/* misc */
.breadcrumb{font-size:12.5px;color:var(--slate-500);margin:16px 0 4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.breadcrumb button{background:none;border:none;color:var(--navy-800);cursor:pointer;font-size:12.5px;padding:0}
.progress-pill{font-size:12px;font-weight:700;color:var(--teal-700)}
.ring{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:23px;color:var(--ink-900);margin:0 auto}
.acc{border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;background:var(--white);overflow:hidden}
.acc .q{padding:13px 16px;font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;gap:10px;cursor:pointer;background:none;border:none;width:100%;text-align:left;font-family:inherit;color:var(--ink-700)}
.acc .a{padding:0 16px 13px;font-size:13.5px;color:var(--slate-600);line-height:1.6}
.acc .a[hidden]{display:none}
.toc-link{display:block;background:none;border:none;text-align:left;padding:8px 10px;font-size:13.5px;color:var(--slate-600);cursor:pointer;border-radius:6px;width:100%}
.toc-link:hover{background:var(--surface-2);color:var(--ink-900)}
.toc-link.on{background:var(--amber-50);color:var(--amber-800);font-weight:700}
.notepad textarea{min-height:110px}
.hero{background:linear-gradient(160deg,var(--ink-900),#24344A);color:#E9EDF2;padding:clamp(36px,6vw,72px) 0}
.hero h1{color:#fff;font-size:clamp(30px,6vw,44px)}
.hero p{color:#D6DBE1;max-width:60ch;font-size:clamp(15px,2.4vw,18px)}
.hero .chip{background:#2C3A4E;border-color:#55647A;color:#D6DBE1}
.notes-list .note{border-left:4px solid var(--amber-500);background:var(--amber-50);padding:10px 14px;border-radius:0 8px 8px 0;margin-bottom:10px;font-size:13.5px}
@media print{.topbar,.footer,.skip-link,.top-actions,.btn{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<a class="skip-link" href="#app">Skip to content</a>
<div id="toast-root" aria-live="polite"></div>
<header class="topbar" id="topbar"></header>
<nav class="mobile-menu" id="mobilemenu" aria-label="Main menu"></nav>
<main id="app" tabindex="-1"></main>
<footer class="footer" id="footer"></footer>
<script>
/* ============ FDE Academy — core engine: store, router, icons, math & interactive components ============ */
"use strict";
const FDE = {};

/* ---------------- utilities ---------------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
const fmtDate = ts => new Date(ts).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const todayStr = () => new Date().toISOString().slice(0, 10);
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");

const STORE_KEY = "fdeAcademy.v1";
const store = {
  s: null,
  blank() {
    return {

      lessons: {}, books: {}, projects: {},
      attempts: [], days: [], glossaryEdits: { added: [], edited: {}, removed: [] },
      labRuns: 0, sample: false,
    };
  },
  load() {
    try { this.s = JSON.parse(localStorage.getItem(STORE_KEY)) || this.blank(); }
    catch (e) { this.s = this.blank(); }
    if (!this.s.profile) this.s = this.blank();
  },
  save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(this.s)); } catch (e) { /* private mode */ } },
  touch() { const d = todayStr(); if (!this.s.days.includes(d)) { this.s.days.push(d); this.save(); } },
  lesson(id) { return this.s.lessons[id] || (this.s.lessons[id] = { done: false, quizBest: 0, notes: "", bookmark: false, visits: 0 }); },
  book(id) { return this.s.books[id] || (this.s.books[id] = { chapters: [], last: null }); },
  project(id) { return this.s.projects[id] || (this.s.projects[id] = { steps: [], submitted: false, evidence: "", score: null, submittedAt: null }); },
  reset() { this.s = this.blank(); this.save(); },
  /* ---- derived, all computed from real recorded activity ---- */
  activeDays() { return [...new Set(this.s.days)].sort(); },
  streak() {
    const days = this.activeDays().map(d => new Date(d + "T12:00:00").getTime());
    if (!days.length) return { current: 0, longest: 0 };
    let longest = 1, run = 1;
    for (let i = 1; i < days.length; i++) {
      run = (days[i] - days[i - 1] === 86400000) ? run + 1 : 1;
      longest = Math.max(longest, run);
    }
    const last = days[days.length - 1]; const now = Date.now();
    const current = (now - last <= 86400000 * 1.5) ? run : 0;
    return { current: Math.max(current, days.length === 1 && (now - last <= 86400000 * 1.5) ? 1 : current), longest };
  },
  lessonDoneCount() { return Object.values(this.s.lessons).filter(l => l.done).length; },
  totalLessons() { return DATA.lessons.length; },
  overallPct() { return Math.round(100 * this.lessonDoneCount() / Math.max(1, this.totalLessons())); },
  currentStageId() {
    for (const st of DATA.stages) {
      const ls = DATA.lessons.filter(l => l.stage === st.id);
      if (ls.length && ls.some(l => !this.lesson(l.id).done)) return st.id;
    }
    return DATA.stages[DATA.stages.length - 1].id;
  },
  stageProgress(stageId) {
    const ls = DATA.lessons.filter(l => l.stage === stageId);
    if (!ls.length) return { done: 0, total: 0, pct: null };
    const done = ls.filter(l => this.lesson(l.id).done).length;
    return { done, total: ls.length, pct: Math.round(100 * done / ls.length) };
  },
  stageDone(stageId) { const p = this.stageProgress(stageId); return p.total > 0 && p.done === p.total; },
  stageState(stageId) {
    const order = DATA.stages.findIndex(s => s.id === stageId);
    if (this.stageDone(stageId)) return "done";
    const prevDone = DATA.stages.slice(0, order).every(s => this.stageDone(s.id) || !DATA.lessons.some(l => l.stage === s.id));
    return prevDone ? "current" : "upcoming";
  },
  recommended() {
    const sid = this.currentStageId();
    const ls = DATA.lessons.filter(l => l.stage === sid);
    const next = ls.find(l => !this.lesson(l.id).done) || ls[0];
    return next ? { lesson: next, stage: DATA.stages.find(s => s.id === sid) } : null;
  },
  quizAvg(n = 10) {
    const a = this.s.attempts.filter(x => x.kind === "quiz").slice(-n);
    if (!a.length) return null;
    return Math.round(100 * a.reduce((t, x) => t + x.score / x.total, 0) / a.length);
  },
  projectsDone() { return DATA.projects.filter(p => this.project(p.id).submitted).length; },
};

/* ---------------- router ---------------- */
const ROUTES = [];
function route(pattern, view) { ROUTES.push({ pattern, view }); }
function matchRoute(hash) {
  const path = (hash || "#/").replace(/^#\/?/, "").replace(/\?.*$/, "");
  const parts = path.split("/").filter(Boolean);
  for (const r of ROUTES) {
    const segs = r.pattern.split("/").filter(Boolean);
    if (segs.length !== parts.length) continue;
    const params = {}; let ok = true;
    for (let i = 0; i < segs.length; i++) {
      if (segs[i].startsWith(":")) params[segs[i].slice(1)] = decodeURIComponent(parts[i]);
      else if (segs[i] !== parts[i]) { ok = false; break; }
    }
    if (ok) return { view: r.view, params, path };
  }
  return null;
}
let CURRENT = { path: null, view: null, params: null };
function renderRoute() {
  const m = matchRoute(location.hash);
  const app = $("#app");
  $$("#mobilemenu button").forEach(b => b.setAttribute("aria-current", b.dataset.r === (m ? m.path : "home") ? "page" : "false"));
  $$("#topnav-inner button").forEach(b => b.setAttribute("aria-current", b.dataset.r === (m ? m.path : "home") ? "page" : "false"));
  if (!m) {
    document.title = "Page not found — FDE Academy";
    app.innerHTML = `<div class="wrap" style="padding:60px 0"><div class="empty"><b>That page does not exist.</b><br><br>The link may be old or mistyped. Everything in the academy is reachable from the navigation above or the footer below.<br><br><button class="btn primary" data-nav="home">Go to the homepage</button></div></div>`;
    renderChrome("404"); return;
  }
  try {
    document.title = m.view.title(m.params) + " — FDE Academy";
    const html = m.view.render(m.params);
    if (html && html.then) {
      app.innerHTML = `<div class="wrap" style="padding:40px 0"><div class="skeleton" style="height:220px"></div></div>`;
      html.then(h => { app.innerHTML = h; m.view.mount && m.view.mount(m.params); });
    } else {
      app.innerHTML = html;
      if (CURRENT.view && CURRENT.view.unmount) CURRENT.view.unmount();
      m.view.mount && m.view.mount(m.params);
    }
    CURRENT = m;
    if (!location.hash.includes("no-scroll")) app.focus({ preventScroll: true });
  } catch (err) {
    app.innerHTML = `<div class="wrap" style="padding:50px 0"><div class="statebox err"><b>Something went wrong while rendering this page.</b><br>${esc(err.message)}</div><button class="btn" data-nav="dashboard">Back to dashboard</button></div>`;
  }
  renderChrome(m.path);
}
function nav(path) {
  location.hash = "#/" + path;
  $("#mobilemenu").classList.remove("open");
  window.scrollTo({ top: 0, behavior: "auto" });
}

/* ---------------- mini math renderer ---------------- */
function m(s) {
  let out = esc(s);
  out = out.replace(/sqrt\(([^()]+)\)/g, (_m2, a) => `<span class="msqrt"><span class="sign"></span><span class="body">${a}</span></span>`);
  out = out.replace(/\{([^{}]+)\}\/\{([^{}]+)\}/g, (_m2, a, b) => `<span class="mfrac"><span class="top">${a}</span><span class="bot">${b}</span></span>`);
  out = out.replace(/\^\{([^}]+)\}/g, (_m2, e) => `<span class="msup">${e}</span>`);
  out = out.replace(/\^(\d)/g, (_m2, e) => `<span class="msup">${e}</span>`);
  return out;
}

function stepcalc(title, steps) {

function wireNumberline(id, opts, onChange) {

  svg.addEventListener("pointerdown", e => {
    const r = svg.getBoundingClientRect();
    const move = ev => set(min + (max - min) * (ev.clientX - r.left - 30 * r.width / 560) / (500 * r.width / 560));

}

function wirePlot(id, opts) {
  const svg = $("#" + id); if (!svg) return;
  const { fn, xmin = -5, xmax = 5, yMin, yMax, marks = [], unitY = "" } = opts;
  const W = 560, H = 300, PAD = 30;
  const ys = []; const N = 240;
  for (let i = 0; i <= N; i++) { const x = xmin + (xmax - xmin) * i / N; ys.push(fn(x)); }
  let lo = yMin !== undefined ? yMin : Math.min(...ys), hi = yMax !== undefined ? yMax : Math.max(...ys);
  if (hi - lo < 1e-9) { hi = lo + 1; }
  const lo2 = Math.min(lo, Math.min(...marks.map(m2 => m2.y), ...ys.filter(Number.isFinite)));
  const hi2 = Math.max(hi, Math.max(...marks.map(m2 => m2.y), ...ys.filter(Number.isFinite)));
  const X = x => PAD + (W - 2 * PAD) * (x - xmin) / (xmax - xmin);
  const Y = y => H - PAD - (H - 2 * PAD) * (y - lo2) / (hi2 - lo2);
  let axes = `<line x1="${X(xmin)}" y1="${Y(0)}" x2="${X(xmax)}" y2="${Y(0)}" stroke="#B9C2CC" stroke-width="1.6"/>
  <line x1="${X(0)}" y1="${Y(hi2)}" x2="${X(0)}" y2="${Y(lo2)}" stroke="#B9C2CC" stroke-width="1.6"/>`;
  const step = (xmax - xmin) / 10;
  for (let x = Math.ceil(xmin / step) * step; x <= xmax; x += step) {
    if (Math.abs(x) < 1e-9) continue;
    axes += `<line x1="${X(x)}" y1="${Y(0) - 4}" x2="${X(x)}" y2="${Y(0) + 4}" stroke="#B9C2CC"/>
    <text x="${X(x)}" y="${Y(0) + 16}" text-anchor="middle" font-size="10" fill="#68727E">${Math.round(x * 10) / 10}</text>`;
  }
  $("#" + id + "-axes").innerHTML = axes;
  let d = ""; let started = false;
  for (let i = 0; i <= N; i++) {
    const x = xmin + (xmax - xmin) * i / N; const y = fn(x);
    if (!Number.isFinite(y) || y < lo2 - (hi2 - lo2) || y > hi2 + (hi2 - lo2)) { started = false; continue; }
    d += (started ? "L" : "M") + X(x).toFixed(1) + " " + Y(y).toFixed(1); started = true;
  }
  $("#" + id + "-curve").setAttribute("d", d);
  $("#" + id + "-marks").innerHTML = marks.map(mk =>
    `<circle cx="${X(mk.x)}" cy="${Y(mk.y)}" r="5" fill="${mk.color || "#2E7D74"}" stroke="#1A2330" stroke-width="1.6"/>
     <text x="${X(mk.x)}" y="${Y(mk.y) - 10}" text-anchor="middle" font-size="11" font-weight="700" fill="#1A2330">${esc(mk.label || "")}</text>`).join("");
  svg.addEventListener("pointermove", e => {
    const r = svg.getBoundingClientRect();
    const x = xmin + (xmax - xmin) * ((e.clientX - r.left) / r.width * W - PAD) / (W - 2 * PAD);
    const y = fn(x);
    $("#" + id + "-read").textContent = Number.isFinite(y) ? `x=${x.toFixed(2)} → y=${y.toFixed(2)}${unitY}` : "";
  });
  svg.addEventListener("pointerleave", () => { $("#" + id + "-read").textContent = ""; });
}

lesson({
  id: "fm-1", course: "fm", stage: "s2", module: "Numbers and operations", chapter: "1. Numbers and operations", minutes: 25,
  title: "The four operations, in real shops",
  objectives: ["Choose the right operation for a business question", "Compute with confidence and check the result", "Spot which operation a story problem is really asking for"],
  blocks: [
    { t: "p", x: `Every business question about quantities uses one of the four operations. The skill is not computing — a calculator does that — it is knowing ${T("operation", "which operation")} the story is asking for. Addition brings quantities together ("144 rolls were baked, 57 sold — 201 handled so far"). Subtraction finds what remains or what changed. Multiplication repeats equal groups ("6 crates of 24 rolls"). Division shares or groups ("144 rolls into bags of 6").` },
    { t: "table", caption: "Story cues and the operations they signal", headers: ["The story says", "Operation", "Example"], rows: [
      ["altogether, in total, combined", "Addition", "57 + 144 + 12 = 213 rolls handled"],
      ["left, remaining, difference", "Subtraction", "144 − 57 = 87 rolls left"],
      ["each crate holds…, rows of…", "Multiplication", "6 crates × 24 = 144 rolls"],
      ["shared equally, per box, each gets", "Division", "144 ÷ 6 = 24 rolls per box"] ] },
    { t: "p", x: `Amara runs a market stall. On Friday she baked 144 rolls and sold 57 by noon. In the afternoon she sold rolls in bags of 6. A customer asks: "how many bags can I still buy, and how many rolls would be left over?" That is two operations in one story: first subtract to find what remains, then divide — and the ${T("remainder", "remainder")} is the leftover rolls, not a rounding error to ignore.` },
    { t: "steps", title: "Amara's afternoon bags", steps: [
      { expr: "144 − 57 = 87", note: "Subtract: rolls remaining after the morning." },
      { expr: "87 ÷ 6 = 14 remainder 3", note: "Divide: 14 full bags of 6, because 14 × 6 = 84." },
      { expr: "14 bags, 3 rolls left over", note: "The remainder answers the second half of the question." } ] },
    { t: "exercise", prompt: "A courier carries 250 flyers and delivers them in bundles of 8 to each shop. How many complete bundles can be delivered, and how many flyers stay in the bag?",
      hint: "First operation: none needed — 250 is already the total. Second: 250 ÷ 8, keep the remainder honest.",
      solution: "250 ÷ 8 = 31 remainder 2 → 31 complete bundles (248 flyers), 2 flyers left in the bag." },
  ],
  quiz: [
    { q: "A story says 'shared equally among the stalls'. Which operation?", options: ["Addition", "Multiplication", "Division", "Subtraction"], answer: 2,
      why: "'Shared equally' signals division — splitting into equal groups." },
    { q: "144 − 57 = ?", options: ["97", "87", "77", "91"], answer: 1,
      why: "144 − 57: 144 − 50 = 94, then 94 − 7 = 87." },
    { q: "87 ÷ 6 gives 14 remainder r. What is r, and what does it mean here?", options: ["r = 2 — rounding error to discard", "r = 3 — three rolls left unbought", "r = 3 — add it to the bags", "r = 0 — it divides exactly"], answer: 1,
      why: "14 × 6 = 84, so 3 remain. In this story those are real rolls, not noise." },
  ],
});
lesson({
  id: "fm-2", course: "fm", stage: "s2", module: "Numbers and operations", chapter: "1. Numbers and operations", minutes: 25,
  title: "Fractions you can see",
  objectives: ["Read a fraction as parts of a whole, not two separate numbers", "Compare fractions using pictures and equivalents", "Add fractions with the same denominator"],
  blocks: [
    { t: "p", x: `A ${T("fraction", "fraction")} names a part of a whole. In {3}/{4}, the bottom number (the denominator) says the whole was cut into 4 equal parts; the top number (the numerator) says we took 3 of them. The bar itself is the important part — it means "out of", not "divide whenever you feel like it".` },
    { t: "frac", n: 3, d: 4, label: "Three quarters of the tray" },
    { t: "p", x: `Comparing fractions is easier when the parts are the same size. {2}/{4} and {1}/{2} shade the same amount — they are ${T("equivalent-fractions", "equivalent")}. To compare {2}/{3} with {3}/{4}, cut both wholes into 12: {8}/{12} against {9}/{12}, so {3}/{4} is bigger. Same denominator, compare tops; same top, compare bottoms (smaller bottom = bigger parts).` },
    { t: "p", x: `Adding fractions only works when the parts are the same size already: {2}/{5} + {1}/{5} = {3}/{5}. Amara sells {2}/{5} of her rolls before noon and another {1}/{5} by two o'clock — three fifths gone, two fifths left. When denominators differ, first rename both into a common one, then add tops.` },
    { t: "exercise", prompt: "Amara bakes one big tray. By 10am she has sold {1}/{4} of it, by noon another {2}/{4}. What fraction is left, and is that more or less than half?",
      hint: "Same denominator — add tops, then compare with {2}/{4}.",
      solution: "{1}/{4} + {2}/{4} = {3}/{4} sold, so {1}/{4} remains. A quarter is less than a half." },
  ],
  quiz: [
    { q: "In {3}/{5}, what does the 5 tell you?", options: ["We took 5 parts", "The whole was cut into 5 equal parts", "The answer is 5", "Five people are sharing"], answer: 1,
      why: "The denominator counts the equal parts of the whole." },
    { q: "Which is bigger: {2}/{3} or {3}/{4}?", options: ["{2}/{3}", "{3}/{4}", "They are equal", "Cannot compare"], answer: 1,
      why: "Cut into twelfths: {8}/{12} vs {9}/{12} — three quarters wins." },
    { q: "{2}/{7} + {3}/{7} = ?", options: ["{5}/{14}", "{5}/{7}", "{6}/{7}", "{1}/{2}"], answer: 1,
      why: "Same denominator: add the tops, keep the bottom — five sevenths." },
  ],
});
lesson({

  title: "Decimals and money",

    { t: "p", x: `A decimal is a fraction wearing a different uniform: 0.25 is {25}/{100}, 0.5 is {5}/{10} is {1}/{2}. Money makes this concrete — £12.40 is twelve pounds and forty hundredths of a hundred pennies. The place values march by tens: tenths, hundredths, thousandths.` },
    { t: "p", x: `The one rule that prevents most money mistakes: align the decimal points before adding or subtracting. 12.4 + 3.85 is a trap unless you write 12.40 + 3.85 = 16.25. Amara's till does this for her, but an FDE writing a script must do it for the till.` },
    { t: "p", x: `Rounding is a decision with consequences. Round £4.49 down to £4 for the business report and the month's totals drift by pennies that add up. The honest rule: say which way you rounded and why. "Nearest penny" is the default; "round up to whole items" appears whenever you cannot sell two-thirds of a roll.` },

    { q: "4.49 rounded to the nearest ten pence (0.1) is…", options: ["4.4", "4.5", "4.49", "4.0"], answer: 1,

lesson({

    { t: "p", x: `A ${T("ratio", "ratio")} compares quantities in a fixed relationship. Amara's dough recipe uses flour and water in ratio 5 : 3 — five parts flour to three parts water. Double the flour and you must double the water; the relationship, not the raw numbers, is the rule. Scaling a recipe, an order or a delivery route is always this move: multiply every part by the same factor.` },

lesson({

    { t: "p", x: `A percentage is a fraction with a promised denominator: "per hundred". 35% means {35}/{100} of whatever the whole is. The whole is the trap — "sales up 50%" can be honest and still tiny if the starting month was one bad week. Always ask: fifty percent of what?` },
    { t: "pct", pct: 35, of: 60, label: "35% of Amara's 60 morning rolls" },
    { t: "p", x: `Two everyday computations cover most business life. Percentage of an amount: 35% of 60 = 0.35 × 60 = 21 rolls sold in the morning rush. Percentage change: (new − old) ÷ old × 100 — if takings go from £240 to £300, that is 60 ÷ 240 = 25% up. Notice the change is always divided by the ${T("base", "old value")}, not the new one.` },

  id: "fm-6", course: "fm", stage: "s2", module: "Ratios, percentages and money", chapter: "2. Ratios and proportions", minutes: 30,
  title: "Break-even: the first business model",
  objectives: ["Build the break-even equation from a customer's costs", "Compute break-even quantity and interpret the remainder honestly", "Explain what break-even does and does not assume"],
  blocks: [
    { t: "p", x: `The ${T("break-even", "break-even point")} is where money in exactly equals money out — no profit, no loss. Every business question starts here because it is the smallest model that still tells the truth. Amara pays a £20 stall fee whether she sells one roll or three hundred (${T("fixed-cost", "fixed cost")}); each roll sells at £4.00 and costs £1.50 in flour and butter (variable cost), so each roll contributes £2.50.` },
    { t: "ieq", caption: "Break-even explorer — drag the sliders", sliders: [
      { key: "fc", label: "Fixed cost £", min: 0, max: 60, step: 1, val: 20 },
      { key: "p", label: "Price £ per roll", min: 1, max: 8, step: 0.25, val: 4 },
      { key: "c", label: "Variable cost £ per roll", min: 0.25, max: 4, step: 0.25, val: 1.5 } ],
      display: v => v.p <= v.c ? `Contribution = ${v.p} − ${v.c} = ${(v.p - v.c).toFixed(2)} — every roll LOSES money. Break-even is unreachable.` :
        `Contribution = ${v.p} − ${v.c} = £${(v.p - v.c).toFixed(2)} → Break-even = {${v.fc}}/{${(v.p - v.c).toFixed(2)}} ≈ ${Math.ceil(v.fc / (v.p - v.c))} rolls`,
      note: v => v.p <= v.c ? "The stall fee can never be covered — this is why pricing below cost cannot be rescued by volume." :
        `She must round UP to ${Math.ceil(v.fc / (v.p - v.c))} whole rolls — ${Math.floor(v.fc / (v.p - v.c))} rolls would leave her a little short.` },
    { t: "steps", title: "The standard case", steps: [
      { expr: "Contribution = price − variable cost = 4.00 − 1.50 = £2.50", note: "What each sale actually adds toward the stall fee." },
      { expr: "Break-even = {fixed cost}/{contribution} = {20}/{2.50} = 8", note: "Eight rolls covers everything exactly." },
      { expr: "Roll 9 onward earns £2.50 profit each", note: "This is why businesses care about contribution, not just price." } ] },
    { t: "p", x: `What the model assumes matters as much as the number it returns: prices and costs stay the same over the period, every roll sells, and there is exactly one product. An FDE states these assumptions in the handover document — a model that hides its assumptions is a model that will be trusted exactly once too many.` },
    { t: "exercise", prompt: "A coffee cart pays £45 per day for its pitch. Each cup sells at £2.80 and costs £1.05 to make. Compute the break-even number of cups and the profit on the 60th cup.",
      hint: "Contribution first, then divide, then round up if needed.",
      solution: "Contribution = 2.80 − 1.05 = £1.75. Break-even = 45 ÷ 1.75 ≈ 25.7 → 26 cups (25 cups = £43.75, still £1.25 short). Cup 60: profit = (60 − 26) × 1.75 = £59.50." },

      why: "Contribution is price minus variable cost — it contributes toward covering fixed costs." },
    { q: "Fixed cost £20, contribution £2.50. Break-even is…", options: ["5 rolls", "8 rolls", "10 rolls", "22 rolls"], answer: 1,
      why: "20 ÷ 2.5 = 8 exactly." },
    { q: "Why round break-even UP to a whole number?", options: ["Rounding is polite", "Selling fewer than the exact value leaves the fee partly unpaid", "Rolls come in tens", "The calculator says so"], answer: 1,
      why: "A fractional roll cannot be sold — the first whole number at or above break-even is the honest answer." },

lesson({

    { q: "Cost = 40 + 2b for b = 12 is…", options: ["£42", "£54", "£64", "£68"], answer: 3,

lesson({

  blocks: [
    { t: "p", x: `The ${T("distributive-law", "distributive law")} says multiplication spreads over addition: a(b + c) = ab + ac. Going inward (expanding) turns a compact rule into a computable one: 3(2n + 4) = 6n + 12. Going outward (${T("factorising", "factorising")}) reveals structure: 6n + 12 = 6(n + 2), which says "three orders of (two rolls plus four)".` },
    { t: "p", x: `Why care about direction? Because questions ask different things. "What does one extra basket cost?" is easy from 6(n + 2) — six times the basket contents. "What is the cost for n = 5?" is easy from 6n + 12 — substitute and compute. Expanding exposes terms; factorising exposes structure. Engineers move both ways constantly.` },

      { expr: "Expand: 4(p − 2) = 4p − 8", note: "Multiply both terms, watch the minus sign." },

lesson({

    { q: "Solution of 2.5n − 20 = 30 is…", options: ["n = 10", "n = 20", "n = 12", "n = 50"], answer: 1,

lesson({

/* ---------------- Course: Logic & Proof (Stage 4) ---------------- */
lesson({
  id: "lo-1", course: "logic", stage: "s4", module: "Statements and truth", chapter: "5. Statements", minutes: 25,
  title: "Statements, and, or, not",
  objectives: ["Recognise what makes a sentence a statement", "Build compound statements with and, or, not", "Compute truth values without guessing"],
  blocks: [
    { t: "p", x: `A ${T("statement", "statement")} is a sentence that is definitely true or definitely false — never both, never neither. "The delivery arrived on Tuesday" is a statement. "Is the delivery here?" is a question; "deliver it soon" is a command; both are outside logic. Precision here is precision later: code conditions, database filters and AI refusals are all statements in costume.` },
    { t: "p", x: `${T("conjunction", "AND")} demands both parts true; ${T("disjunction", "OR")} is satisfied by at least one (inclusive or); ${T("negation", "NOT")} flips. "Paid AND delivered" gates a shipment — one missing part blocks it. "Coupon OR member" grants the discount to either. "NOT damaged" passes only intact items.` },
    { t: "table", caption: "Truth table for A and B combined", headers: ["A", "B", "A AND B", "A OR B", "NOT A"], rows: [
      ["true", "true", "true", "true", "false"],
      ["true", "false", "false", "true", "false"],
      ["false", "true", "false", "true", "true"],
      ["false", "false", "false", "false", "true"] ] },
    { t: "exercise", prompt: "A refund rule: refund is given when (receipt shown AND within 30 days) OR VIP customer. Is a VIP customer without a receipt, outside 30 days, refunded? Why?",
      hint: "Evaluate the two sides of the OR separately, then combine.",
      solution: "Left side: false (both conditions fail). Right side: true (VIP). false OR true = true → refunded. The rule as written makes VIPs unconditionally refundable — logic exposes that." },
  ],
  quiz: [
    { q: "Which is a statement?", options: ["Close the door!", "Is it raining?", "The order shipped on Monday", "Maybe it shipped"], answer: 2,
      why: "It has a definite truth value; questions, commands and vagueness are not statements." },
    { q: "'Coupon OR member' grants the discount to…", options: ["Only customers with both", "Customers with at least one", "Nobody", "Everyone"], answer: 1,
      why: "Inclusive OR: one true part suffices." },
    { q: "NOT(false) is…", options: ["false", "true", "undefined", "maybe"], answer: 1,
      why: "Negation flips the truth value." },
  ],
});
lesson({
  id: "lo-2", course: "logic", stage: "s4", module: "Statements and truth", chapter: "5. Statements", minutes: 25,
  title: "If-then and the converse trap",
  objectives: ["Read if-then statements and spot when they are true", "Distinguish a claim from its converse", "Use counterexamples to test claims"],
  blocks: [
    { t: "p", x: `An ${T("implication", "if-then statement")} promises only one thing: IF the hypothesis holds THEN the conclusion does. "If the parcel weighs over 2 kg THEN it costs £6." The promise breaks only in one case: hypothesis true, conclusion false. A heavy parcel priced at £4 breaks it; a light parcel at £6 does not — the rule said nothing about light parcels.` },
    { t: "p", x: `The ${T("converse", "converse")} swaps the two parts, and it is a different claim. "If it costs £6 THEN it weighs over 2 kg" does not follow from the original rule — maybe £6 also covers bulky-but-light parcels. Swapping is how correct rules become incorrect ones; engineers who quote the converse without noticing ship bugs.` },
    { t: "p", x: `A ${T("counterexample", "counterexample")} kills a false claim with a single example: one £6 parcel under 2 kg disproves the converse instantly. Finding one is a superpower — it converts an argument into a fact.` },
    { t: "exercise", prompt: "Rule: 'If a stall pays the weekly fee THEN it may trade on Saturday.' A trader trades on Saturday without paying. Does this break the rule? What would break it?",
      hint: "The rule promises trading only for payers; it says nothing about non-payers. Break it with: payer forbidden to trade.",
      solution: "No — the rule restricts nothing about non-payers. Only a payer who is forbidden to trade (hypothesis true, conclusion false) breaks it." },
  ],
  quiz: [
    { q: "An if-then claim is false exactly when…", options: ["Both parts are false", "Hypothesis true and conclusion false", "Hypothesis false", "The conclusion is surprising"], answer: 1,
      why: "That is the single broken-promise case." },
    { q: "The converse of 'If P then Q' is…", options: ["If Q then P", "If not P then not Q", "P and Q", "P or Q"], answer: 0,
      why: "The converse swaps hypothesis and conclusion." },
    { q: "A counterexample to 'All heavy parcels cost £6' is…", options: ["A £6 light parcel", "A heavy parcel costing £4", "A £4 light parcel", "No parcels exist"], answer: 1,
      why: "It satisfies 'heavy' but breaks the pricing conclusion." },
  ],
});
lesson({
  id: "lo-3", course: "logic", stage: "s4", module: "Proof techniques", chapter: "6. Reasoning", minutes: 30,
  title: "Direct proof and proof by cases",
  objectives: ["Structure a direct proof: assumptions to conclusion", "Split a claim into exhaustive cases", "Judge when a proof is complete"],
  blocks: [
    { t: "p", x: `A ${T("direct-proof", "direct proof")} walks from agreed facts to the conclusion with no leaps. Claim: "if a number of rolls n is even, then n² is even." Proof: even means n = 2k for some whole k; then n² = (2k)² = 4k² = 2(2k²), which is twice a whole number, hence even. Every symbol earned its place — that is the whole art.` },
    { t: "p", x: `${T("proof-by-cases", "Proof by cases")} handles claims that behave differently depending on the situation. Claim: "consecutive whole numbers always multiply to an even product." Cases: if the first is even, done; if the first is odd, the second is even, done. The cases cover everything — that exhaustiveness is what makes the proof complete. A proof with a gap ("what if the first is half-even?") proves nothing.` },
    { t: "callout", style: "info", x: "Why engineers prove things: a tested program shows the inputs you tried; a proof shows all inputs. Verification culture at the academy is the same idea at smaller scale — check, don't hope." },
    { t: "exercise", prompt: "Prove by cases: the sum of two consecutive whole numbers, n + (n+1), is always odd. Write the two cases explicitly.",
      hint: "Case on whether n is even or odd, and use n = 2k or n = 2k + 1.",
      solution: "Case n = 2k (even): sum = 2k + 2k + 1 = 4k + 1 = 2(2k) + 1 → odd. Case n = 2k + 1 (odd): sum = 2k + 1 + 2k + 2 = 4k + 3 = 2(2k + 1) + 1 → odd. Both cases give odd; cases are exhaustive; claim proved." },
  ],
  quiz: [
    { q: "A direct proof must…", options: ["Use algebra always", "Derive the conclusion from agreed facts without leaps", "Try many examples", "Be written in symbols only"], answer: 1,
      why: "Examples support; the proof is the derivation." },
    { q: "Proof by cases is valid only when…", options: ["There are two cases", "The cases cover every possibility", "Each case is short", "A diagram is drawn"], answer: 1,
      why: "Exhaustiveness is the licence." },
    { q: "'n even ⇒ n² even' — the proof rewrites n as…", options: ["n = k", "n = 2k", "n = 2k + 1", "n = k²"], answer: 1,
      why: "2k is the definition of even in usable form." },
  ],
});
lesson({
  id: "lo-4", course: "logic", stage: "s4", module: "Proof techniques", chapter: "6. Reasoning", minutes: 30,
  title: "Sets, all and some",
  objectives: ["Read 'for all' and 'there exists' claims correctly", "Negate them without flipping meaning", "Connect quantifiers to loops and tests"],
  blocks: [
    { t: "p", x: `Two quantifiers run the world's claims. "For all" (${T("universal-quantifier", "∀")}) demands every case: "every delivery this week arrived on time." "There exists" (${T("existential-quantifier", "∃")}) demands just one: "some stallholder doubles prices on Saturdays." Getting these backwards is the classic specification bug.` },
    { t: "p", x: `Negation flips them: NOT(for all x, P(x)) = there exists an x where NOT P(x). "Not every delivery was on time" = "at least one delivery was late." You do not need every delivery to be late — one suffices. This one line of logic is why one failing test case breaks an "all tests pass" claim.` },
    { t: "table", caption: "Quantifiers in claims and in code", headers: ["Claim", "Logic", "As a loop"], rows: [
      ["All orders above £50 ship free", "∀ orders o: o > 50 ⇒ free(o)", "if any order > 50 is NOT free → bug found"],
      ["Some roll is gluten-free", "∃ roll r: gf(r)", "keep scanning; stop at first gf roll"],
      ["No damaged item is shipped", "∀ items i: damaged(i) ⇒ ¬shipped(i)", "scan all; any damaged-and-shipped is a failure"] ] },
    { t: "exercise", prompt: "Negate precisely: 'Every stallholder paid the weekly fee.' Then say how many examples would verify your negation.",
      hint: "∀ flips to ∃ under negation.",
      solution: "'There exists a stallholder who did not pay the fee.' One such stallholder verifies it — quantifier negation is what makes single counterexamples decisive." },
  ],
  quiz: [
    { q: "NOT('for all x, P(x)') equals…", options: ["'for all x, NOT P(x)'", "'there exists x with NOT P(x)'", "'there exists x with P(x)'", "'nothing holds'"], answer: 1,
      why: "Breaking a universal needs just one counterexample." },
    { q: "'Some roll is gluten-free' requires finding…", options: ["All rolls gluten-free", "At least one", "Exactly one, no more", "None"], answer: 1,
      why: "∃ = at least one exists." },
    { q: "One failing test breaks 'all tests pass' because…", options: ["Tests are strict", "Negation of ∀ is ∃", "Tests are random", "It does not"], answer: 1,
      why: "A single failure is a witness to the negated universal." },
  ],
});

/* ---------------- Course: Graphs & Networks (Stage 5) ---------------- */
lesson({
  id: "gr-1", course: "graphs", stage: "s5", module: "Graphs and paths", chapter: "7. Graphs", minutes: 30,
  title: "Modelling with nodes and edges",
  objectives: ["Decide what the nodes and edges should be", "Read degree as a direct count of connections", "Explain when a graph model is appropriate — and when not"],
  blocks: [
    { t: "p", x: `A ${T("graph", "graph")} is the honest minimal model of a connected situation: ${T("node", "nodes")} for the things, ${T("edge", "edges")} for the direct relationships. Delivery routes: nodes are shops, edges are direct roads with their distances. Who-supplies-whom: nodes are businesses, edges are supply contracts. The modelling decision — what exactly becomes a node — is where most of the thinking happens.` },
    { t: "p", x: `A node's ${T("degree", "degree")} counts its edges. A shop with degree 1 sits on exactly one road: close that road and the shop is unreachable — no algorithm needed, just the definition. Degrees answer reachability questions the way arithmetic answers money questions: instantly and provably.` },
    { t: "table", caption: "Amara's delivery neighbourhood as a graph", headers: ["Edge", "Weight (minutes)"], rows: [
      ["Stall ↔ Market", "5"], ["Stall ↔ Depot", "12"], ["Market ↔ Bakery", "7"], ["Depot ↔ Bakery", "9"], ["Depot ↔ Café", "4"] ] },
    { t: "p", x: `Weights turn a map into a decision tool: edge weights are minutes, costs or capacities depending on the question. Same graph, different weights, different "shortest path" — the model does not choose for you; it records what you told it.` },
    { t: "exercise", prompt: "The Café has exactly one road (to the Depot, 4 minutes). What is its degree, and what happens to deliveries if that road closes? Which vertex would you check next?",
      hint: "Degree counts edges. Reachability follows directly.",
      solution: "Degree 1. Closing the road makes the Café unreachable from anywhere else — no search needed. Check the Depot next: it still has degree 3 and stays connected." },
  ],
  quiz: [
    { q: "A node with degree 1 has…", options: ["One neighbour", "Two neighbours", "No neighbours", "Weight 1 edges"], answer: 0,
      why: "Degree counts incident edges; one edge means one neighbour." },
    { q: "Closing the only road to a degree-1 node makes it…", options: ["Harder to reach", "Unreachable", "Faster to reach", "Unchanged"], answer: 1,
      why: "Its only connection is gone — reachability fails by definition." },
    { q: "What do edge weights usually represent?", options: ["Node names", "Minutes, costs or capacities", "The number of nodes", "Nothing"], answer: 1,
      why: "Weights quantify the relationship the edge models." },
  ],
});
lesson({
  id: "gr-2", course: "graphs", stage: "s5", module: "Graphs and paths", chapter: "7. Graphs", minutes: 30,
  title: "Shortest paths, step by step",
  objectives: ["Trace Dijkstra's idea on a small graph by hand", "State what shortest paths assume", "Convert a path into a delivery plan with total time"],
  blocks: [
    { t: "p", x: `Finding the ${T("shortest-path", "shortest path")} is greedy in the best sense: always expand the cheapest settled frontier. On our neighbourhood graph, from Stall to Bakery, brute force tries Stall→Market→Bakery (5 + 7 = 12) against Stall→Depot→Bakery (12 + 9 = 21) — the market route wins at 12 minutes. The method: keep a best-known distance to every node; improve it whenever a cheaper route appears; stop when your target is settled.` },
    { t: "steps", title: "Settling distances from the Stall", steps: [
      { expr: "Market: 5 (via direct road)", note: "Cheapest frontier first." },
      { expr: "Depot: 12 (direct) vs 5 + 7 + 9 = 21? keep 12", note: "Improve only when genuinely cheaper." },

lesson({
  id: "gr-3", course: "graphs", stage: "s5", module: "Flows and networks", chapter: "8. Connectivity", minutes: 30,
  title: "Connected, or not? Reachability without hope",
  objectives: ["Decide reachability by tracing connections", "Explain single points of failure using degrees", "Describe what makes a network fragile or robust"],
  blocks: [
    { t: "p", x: `${T("connectivity", "Connectivity")} asks: can every node reach every other? Trace it by hand on small graphs — follow edges, mark visited nodes, stop when nothing new is reachable. Any node left unmarked is genuinely unreachable, and no optimism changes that. This is the same flood-fill that powers image tools and, later in the academy, dependency checks.` },
    { t: "p", x: `Fragility has a shape: nodes of degree 1 hang off the network by a thread; nodes that all paths cross are ${T("single-point-of-failure", "single points of failure")}. Robustness means redundancy — a second road to the Café converts its closure from a disaster into a detour. Real infrastructure questions (payment fallbacks, deployment failovers) are this lesson with bigger numbers.` },
    { t: "p", x: `Try it: add or close roads in the explorer below and watch reachability flip. The readout traces connectivity directly from the current edge set.` },
    { t: "ieq", caption: "Network explorer — toggle roads, read reachability", sliders: [
      { key: "cafe", label: "Café–Depot road open? (1 yes / 0 no)", min: 0, max: 1, step: 1, val: 1 },
      { key: "market", label: "Market–Stall road open?", min: 0, max: 1, step: 1, val: 1 },
      { key: "depot", label: "Depot–Stall road open?", min: 0, max: 1, step: 1, val: 1 } ],
      display: v => {
        const links = [["stall", "market", v.market === 1], ["stall", "depot", v.depot === 1], ["depot", "cafe", v.cafe === 1]];
        const reach = n => {
          const seen = new Set([n]); let grew = true;
          while (grew) {
            grew = false;
            for (const [a, b, on] of links) {
              if (!on) continue;
              if (seen.has(a) && !seen.has(b)) { seen.add(b); grew = true; }
              if (seen.has(b) && !seen.has(a)) { seen.add(a); grew = true; }
            }
          }
          return seen;
        };
        const fromStall = reach("stall");
        return `From the Stall you can reach: ${["stall", "market", "depot", "cafe"].filter(n => fromStall.has(n)).join(", ")} — ${fromStall.size === 4 ? "the network is fully connected" : "some venues are cut off"}.`;
      },
      note: v => (v.cafe + v.market + v.depot === 3) ? "All roads open: two independent routes exist into the Depot side." :
        "A closed road can isolate a degree-1 venue instantly — this is what redundancy protects against." },
    { t: "exercise", prompt: "The Depot is the only link between the Stall side and the Café. Name the single point of failure and the cheapest fix.",
      hint: "Look for the node every cross-side path must pass through.",
      solution: "The Depot. Cheapest fix: one extra edge bypassing it (e.g. Market–Café), creating a second route." },
  ],
  quiz: [
    { q: "A node is unreachable from the Stall if…", options: ["Its degree is high", "No chain of open edges connects it", "It is far away", "Its edge is heavy"], answer: 1,
      why: "Reachability is purely about connected chains of edges." },
    { q: "Redundancy in a network means…", options: ["More nodes", "A second route exists between key points", "Heavier edges", "Fewer edges"], answer: 1,
      why: "A second route turns failures into detours." },
    { q: "Which node type is most fragile?", options: ["Degree 3", "Degree 1", "Degree 2", "All equal"], answer: 1,
      why: "One edge — one thread." },
  ],
});

    { q: "A good plausibility check for a delivery time is…", options: ["Is it negative?", "Is it within a sane range for the distance?", "Is it a whole number?", "Did the calculator show it?"], answer: 1,

lesson({
  id: "ai-1", course: "ai1", stage: "s15", module: "Grounded assistants", chapter: "15. Grounding", minutes: 35,
  title: "Why assistants hallucinate — and the grounding rule",
  objectives: ["Explain in plain language why language models invent facts", "State the grounding rule this academy enforces on itself", "Trace one grounded and one ungrounded answer"],
  blocks: [
    { t: "p", x: `A language model predicts plausible text; it does not look up facts. Asked about your company's refund window, it will produce a fluent, confident, possibly invented answer — a ${T("hallucination", "hallucination")}. The failure is not stupidity; it is architecture. The fix is not better wording but better plumbing: give the model the sources and require the answer to come from them.` },
    { t: "p", x: `${T("retrieval", "Retrieval")} searches a trusted corpus (your FAQ, your policy docs) for passages related to the question; ${T("grounding", "grounding")} constrains the answer to those passages with citations. The academy's own rule — taught in Level 6 and enforced in the AI lab on this site — is: answer ONLY from retrieved sources with a citation; if retrieval finds nothing relevant, refuse and hand over to a human.` },
    { t: "table", caption: "Two answers to 'What is your return window?'", headers: ["", "Ungrounded assistant", "Grounded assistant"], rows: [
      ["Answer", "'We offer a 45-day return window, no questions asked.' (invented)", "'Our policy states a 14-day return window for unopened items.' [FAQ §2.1]"],
      ["Failure mode", "Confident fiction — the worst kind", "Honest refusal when sources are missing"] ] },
    { t: "callout", style: "warn", x: "Demos are never called production-ready in this academy. An assistant that answers only from sources is a demo until it has an evaluation set — and even then, it ships with a human handover path." },
    { t: "exercise", prompt: "A shop's FAQ says: 'Collect-by orders are held for 7 days.' A customer asks: 'Can I collect next Thursday if I ordered Monday?' Should the assistant answer 'yes'? What should it do instead?",
      hint: "Is the day-arithmetic IN the sources? The policy states holding period, not date arithmetic policy.",
      solution: "The sources answer 'held for 7 days' but not the Thursday question directly. A grounded assistant restates the policy ('orders are held 7 days [FAQ]') and offers the calculation transparently or hands over — it does not silently invent a yes." },
  ],
  quiz: [
    { q: "Hallucination means…", options: ["The model is offline", "Fluent output that is not grounded in real sources", "A slow answer", "A refusal"], answer: 1,
      why: "Invention, not refusal, is the failure." },
    { q: "The grounding rule requires answers to…", options: ["Be short", "Come only from retrieved sources, with citations — or refuse", "Use emojis", "Avoid numbers"], answer: 1,
      why: "Sources + citation + honest refusal is the rule." },
    { q: "Retrieval is…", options: ["The model's memory", "A search over a trusted corpus feeding the answer", "The user's history", "A spell-checker"], answer: 1,
      why: "Retrieval finds the passages; grounding uses only them." },

lesson({

      { expr: "1. Take the question; lower-case and strip punctuation", note: "Normalisation is half of retrieval quality." },
      { expr: "2. Score each FAQ entry by overlapping keywords", note: "Simple, inspectable, honestly weak on paraphrase." },
      { expr: "3. If best score is 0 → refuse with handover", note: "The refusal IS a feature." },

const SQL_TABLE = [
  { day: "Mon", item: "rolls", qty: 12, price: 4.0 }, { day: "Mon", item: "coffee", qty: 8, price: 2.8 },
  { day: "Tue", item: "rolls", qty: 18, price: 4.0 }, { day: "Tue", item: "cake", qty: 5, price: 3.5 },
  { day: "Wed", item: "rolls", qty: 9, price: 4.0 }, { day: "Wed", item: "coffee", qty: 14, price: 2.8 },
  { day: "Thu", item: "rolls", qty: 21, price: 4.0 }, { day: "Thu", item: "cake", qty: 4, price: 3.5 },
  { day: "Fri", item: "rolls", qty: 24, price: 4.0 }, { day: "Fri", item: "coffee", qty: 11, price: 2.8 },
  { day: "Sat", item: "rolls", qty: 30, price: 4.0 }, { day: "Sat", item: "cake", qty: 12, price: 3.5 },
];
function runSQL(query) {
  const q = query.replace(/--.*$/gm, "").replace(/\s+/g, " ").trim();
  const m = q.match(/^select\s+(.+?)\s+from\s+sales(?:\s+where\s+(.+?))?(?:\s+order\s+by\s+(\w+)(?:\s+(asc|desc))?)?(?:\s+limit\s+(\d+))?\s*;?$/i);
  if (!m) return { error: "Parse error. Supported: SELECT cols|* FROM sales [WHERE col =/>/< value [AND …]] [ORDER BY col [ASC|DESC]] [LIMIT n];" };
  let [, cols, where, orderCol, orderDir, limit] = m;
  let rows = SQL_TABLE.map(r => ({ ...r }));
  if (where) {
    for (const cond of where.split(/\s+and\s+/i)) {
      const cm = cond.trim().match(/^(\w+)\s*(=|>|<)\s*'?([^']+)'?$/i);
      if (!cm) return { error: "Cannot parse condition: " + cond.trim() };
      const [, col, op, raw] = cm;
      const val = isNaN(parseFloat(raw)) ? raw : parseFloat(raw);
      rows = rows.filter(r => op === "=" ? r[col] == val : op === ">" ? r[col] > val : r[col] < val);
    }
  }
  if (orderCol) {
    const dir = (orderDir || "asc").toLowerCase() === "desc" ? -1 : 1;
    rows.sort((a, b) => (a[orderCol] > b[orderCol] ? 1 : a[orderCol] < b[orderCol] ? -1 : 0) * dir);
  }
  if (limit) rows = rows.slice(0, parseInt(limit, 10));
  const names = cols.trim() === "*" ? Object.keys(SQL_TABLE[0]) : cols.split(",").map(c => c.trim());
  for (const c of names) if (!(c in SQL_TABLE[0])) return { error: "Unknown column: " + c };
  return { cols: names, rows: rows.map(r => names.map(c => r[c])) };
}

function faqRetrieve(question) {
  const norm = question.toLowerCase().replace(/[^a-z0-9 ]/g, " ");
  const words = norm.split(/\s+/).filter(w => w && !["the", "a", "an", "of", "to", "is", "are", "do", "i", "my", "you", "can", "what", "on", "for", "your", "and"].includes(w));
  let best = null;
  for (const e of FAQ_CORPUS) {
    const overlap = words.filter(w => e.q.includes(w)).length;
    if (!best || overlap > best.score) best = { ...e, score: overlap };
  }
  return best;
}

"use strict";

function chip(on, label) { return `<button class="chip${on ? " on" : ""}" data-chip="${esc(label)}">${esc(label)}</button>`; }
function renderProseBlock(b) {
  switch (b.t) {
    case "p": return `<p>${b.x}</p>`;
    case "ul": return `<ul>${b.items.map(i => `<li>${i}</li>`).join("")}</ul>`;
    case "table": return `<div class="t-wrap"><table class="t">${b.caption ? `<caption style="caption-side:top;text-align:left;padding:6px 10px;font-size:12.5px;font-weight:700;color:var(--ink-900)">${esc(b.caption)}</caption>` : ""}<thead><tr>${b.headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map(c => `<td>${m(String(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    case "code": return `<div class="codeblock" role="figure" aria-label="Code example"><span class="cm">// ${esc(b.lang || "code")}</span>\n${esc(b.body)}</div>`;
    case "callout": return `<div class="callout ${b.style === "warn" ? "warn" : ""}">${b.x}</div>`;
    case "math": return `<div>${mathExpr(b.x)}</div>`;
    case "steps": return stepcalc(b.title, b.steps);
    case "nl": return numberline(b);
    case "plot": return plot(typeof b.fn === "string" ? { ...b, fn: eval("(" + b.fn + ")") } : b);
    case "ieq": return ieq(b);
    case "frac": return fraction(b);
    case "pct": return percent(b);
    case "geom": return geometry(b);
    case "exercise": return `<div class="exercise"><div class="tag">Practical exercise</div><p style="font-size:14.5px">${b.prompt}</p>
      <details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600;color:var(--amber-800);font-size:13.5px">Hint</summary><p style="margin-top:8px;font-size:13.5px">${esc(b.hint || "Think about the definitions first.")}</p></details>
      <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600;color:var(--teal-700);font-size:13.5px">Solution (after an honest attempt)</summary><p style="margin-top:8px;font-size:13.5px">${m(b.solution || "")}</p></details></div>`;
    default: return `<p>${esc(JSON.stringify(b))}</p>`;
  }
}
FDE.renderProseBlock = renderProseBlock;

let workerRef = null;
function terminateWorker() { if (workerRef) { try { workerRef.terminate(); } catch (e) {} workerRef = null; } }
function runInWorker(code, onOut, onDone) {
  terminateWorker();
  const src = `self.onmessage = function(e) {
    const out = [];
    const origLog = console.log;
    console.log = function(...a) { out.push(a.map(x => typeof x === "object" ? JSON.stringify(x) : String(x)).join(" ")); };
    console.error = function(...a) { out.push("[error] " + a.join(" ")); };
    console.assert = function(cond, msg) { if (!cond) out.push("Assertion failed: " + (msg || "")); };
    const t0 = Date.now();
    try {
      const fn = new Function(e.data);
      fn();
      out.push({ done: true, ms: Date.now() - t0, __obj: true });
      self.postMessage(out.map(x => (x && x.__obj) ? { done: true, ms: x.ms } : String(x)));
    } catch (err) {
      out.push("[error] " + err.name + ": " + err.message + " (line ~" + (err.lineNumber || "?") + ")");
      self.postMessage(out.map(String));
    }
  };`;
  const blob = new Blob([src], { type: "application/javascript" });
  workerRef = new Worker(URL.createObjectURL(blob));
  const timer = setTimeout(() => { terminateWorker(); onOut("[error] Execution stopped: exceeded the 5-second sandbox limit (possible infinite loop)."); onDone(); }, 5000);
  workerRef.onmessage = e => { clearTimeout(timer); terminateWorker(); e.data.forEach(onOut); onDone(); };
  workerRef.postMessage(code);
}

      $("#lab-run").onclick = () => {
        const out = $("#lab-out"); const status = $("#lab-status");
        out.innerHTML = ""; status.textContent = "running…";
        store.s.labRuns++; store.touch(); store.save();
        if (l.kind === "Database") {
          setTimeout(() => {
            const stmts = ta.value.replace(/--.*$/gm, "").split(";").map(s2 => s2.trim()).filter(Boolean);
            status.textContent = "";
            if (!stmts.length) { out.innerHTML = `<span class="oerr">Nothing to run — write a SELECT statement (see the starter).</span>`; return; }
            const chunks = [];
            for (const stmt of stmts) {
              const res = runSQL(stmt);
              if (res.error) { chunks.push(`<span class="oerr">${esc(res.error)}</span>`); break; }
              chunks.push(`<span class="ook">✓ ${esc(stmt.slice(0, 60))}${stmt.length > 60 ? "…" : ""} — ${res.rows.length} row${res.rows.length === 1 ? "" : "s"}</span>\n${esc(res.cols.join(" | "))}\n${res.rows.length ? res.rows.map(r => esc(r.join(" | "))).join("\n") : "(no rows — check your WHERE)"}`);
            }
            out.innerHTML = chunks.join("\n\n");
          }, 80);
        } else {
          runInWorker(ta.value,
            line => { out.innerHTML += (line.done ? `\n<span class="ook">✓ finished in ${line.ms} ms</span>` : "\n" + esc(line)); },

      $("#lab-submit").onclick = () => {
        const code = ta.value.trim();
        if (code === l.starter.trim()) { $("#lab-submsg").textContent = " Submit the version you actually changed — reset-to-starter is not a solution."; $("#lab-submsg").style.color = "var(--red-700)"; return; }
        if (!store.s.submissions) store.s.submissions = [];
        store.s.submissions.push({ lab: l.id, at: Date.now(), code });
        store.touch(); store.save();
        $("#lab-submsg").textContent = " Submitted ✓ — recorded " + new Date().toLocaleTimeString("en-GB");
        $("#lab-submsg").style.color = "var(--teal-700)";
        toast("Lab solution submitted and recorded");
      };
    } else if (l.kind === "API") {
      $("#lab-hint").onclick = () => { const hb = $("#lab-hintbox"); hb.style.display = "block"; hb.innerHTML = "<b>Hint:</b> " + esc(l.hint); };
      $("#lab-solution").onclick = () => { const sb = $("#lab-solbox"); sb.style.display = "block"; sb.innerHTML = "<b>" + esc(l.solution) + "</b>"; };
      $("#lab-run").onclick = () => {
        const out = $("#lab-out");
        const req = $("#lab-code").value.trim();
        const m = req.match(/GET\s+\/orders(\S*)/);
        if (!m) { out.innerHTML = `<span class="oerr">HTTP/1.1 400 Bad Request\n{"error": "Not a GET /orders request"}</span>`; return; }
        const params = new URLSearchParams(m[1].replace(/^\?/, ""));
        const status = params.get("status"), limit = params.get("limit");
        store.s.labRuns++; store.touch(); store.save();
        const ORDERS = [
          { id: 1001, shop: "Bella's", status: "open", total: 42.5 }, { id: 1002, shop: "Amara", status: "open", total: 18 },
          { id: 1003, shop: "Bella's", status: "done", total: 63.25 }, { id: 1004, shop: "Depot", status: "done", total: 12 },
          { id: 1005, shop: "Café", status: "cancelled", total: 7.5 }];
        if (status && !["open", "done", "cancelled"].includes(status)) {
          out.innerHTML = `HTTP/1.1 422 Unprocessable Entity\n{"error": "status must be one of open, done, cancelled", "received": ${JSON.stringify(status)}}`;
          return;
        }
        let rows = status ? ORDERS.filter(o => o.status === status) : ORDERS;
        let lim = limit ? Math.max(1, Math.min(10, parseInt(limit, 10) || 10)) : rows.length;
        out.innerHTML = `HTTP/1.1 200 OK\nContent-Type: application/json\n\n${esc(JSON.stringify(rows.slice(0, lim), null, 1))}\n\n<span class="ook"># ${rows.length} matching orders${lim < rows.length ? `, ${lim} returned (limit)` : ""}</span>`;
      };
    } else if (l.kind === "AI") {
      const answer = q => {
        const best = faqRetrieve(q);
        if (!best || best.score === 0) {
          return `<div class="statebox err"><b>Refusal (by design):</b> I can only answer from the shop FAQ, and nothing there matches “${esc(q)}”. This is the grounded contract — I will not invent an answer. A human colleague is the next step.</div>`;
        }
        return `<div class="statebox ok"><b>Answer ${esc(best.sec)}:</b> ${esc(best.a)}</div>
        <div class="meta">Retrieved FAQ ${esc(best.sec)} · keyword overlap score ${best.score} · grounded on sources only</div>`;
      };
      $("#ai-ask").onclick = () => {
        const q = $("#ai-q").value.trim();
        if (!q) { toast("Type a question first", "err"); return; }
        store.s.labRuns++; store.touch(); store.save();
        $("#ai-out").innerHTML = `<p style="font-weight:600;margin-bottom:8px">Q: ${esc(q)}</p>` + answer(q);
      };
      $("#ai-q").addEventListener("keydown", e => { if (e.key === "Enter") $("#ai-ask").click(); });
      $("#ai-eval").onclick = () => {
        const cases = [
          ["What are your opening hours?", "answer §1"], ["Can I return unopened bread?", "answer §2.1"],
          ["How long do collect-by orders wait?", "answer §2.2"], ["Do you deliver to the moon?", "refusal"],
          ["What was your 2019 revenue?", "refusal (outside sources)"]];
        const results = cases.map(([q, exp]) => {
          const best = faqRetrieve(q);
          const refused = !best || best.score === 0;
          const expectRefusal = exp.startsWith("refusal");
          const pass = refused === expectRefusal || (!refused && exp.startsWith("answer"));
          return `<tr><td>${esc(q)}</td><td>${esc(exp)}</td><td>${refused ? "refused" : "answered " + esc(best.sec) + " (score " + best.score + ")"}</td><td>${pass ? '<span class="chip teal">pass</span>' : '<span class="chip red">fail</span>'}</td></tr>`;
        });
        const passed = results.filter(r => r.includes("pass")).length;
        $("#ai-evalout").innerHTML = `<div class="t-wrap"><table class="t"><thead><tr><th>Question</th><th>Expected</th><th>Observed</th><th>Verdict</th></tr></thead><tbody>${results.join("")}</tbody></table></div>
        <p class="meta">Result: ${passed}/5 as expected. ${passed < 5 ? "The failing case is a genuine finding: keyword overlap matches on the word “deliver”, so an off-topic delivery question rides through to §3 — a production fix is a retrieval threshold or negative-match list. The evaluation set did its job by exposing it." : ""} Honest scoping: this proves behaviour on THIS set only — the handover document states what would make it production-ready.</p>`;
      };
    }
  },
});

    const tabs = [["take", "Available"], ["results", "Results"], ["mock", "Mock exam"], ["report", "Progress report"]];
    let body = "";
    if (tab === "take") {
      body = COURSES.filter(c => TOPIC_TESTS.some(t => t.course === c.id)).map(c => {
        const t = TOPIC_TESTS.find(x => x.course === c.id);
        const attempts = store.s.attempts.filter(a => a.quizId === t.id);
        const best = attempts.length ? Math.max(...attempts.map(a => a.score)) : null;
        return `<div class="card" style="margin-bottom:14px"><div class="row spread">
          <div><h4>${I("check")} ${esc(t.title)}</h4>
          <p style="font-size:12.5px">${t.questions.length} questions · ${t.minutes} min · pass at ${t.pass}% · unlimited honest attempts</p>
          <div class="meta"><span class="chip">${esc(DATA.courseById(c.id).subject)}</span><span class="chip">Stage ${stageById(c.stage).n}</span>
